{{- $values := $.Values }}
{{- range $roleName, $roleCfg := .Values.roleGroups }}
{{- $workloadCfg := merge (deepCopy (default (dict) $roleCfg.workload)) $values.roleDefaults.workload }}
{{- $effectiveSvc := merge (deepCopy (default (dict) $roleCfg.service)) $values.roleDefaults.service }}
{{- if (and $roleCfg.enabled (and $roleCfg.service (hasKey $roleCfg.service "create") $roleCfg.service.create)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $roleName }}
  labels:
    {{- include "hasher-matcher-actioner.labels" $ | nindent 4 }}
  {{- with $effectiveSvc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $effectiveSvc.type }}
  ports:
    - name: http
      port: {{ $effectiveSvc.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "hasher-matcher-actioner.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $roleName }}
{{- end }}
{{- if (and $roleCfg.enabled (eq $workloadCfg.kind "StatefulSet")) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ default (printf "%s-headless" $roleName) $workloadCfg.serviceName }}
  labels:
    {{- include "hasher-matcher-actioner.labels" $ | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: {{ $effectiveSvc.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "hasher-matcher-actioner.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $roleName }}
{{- end }}
{{- end }}
